name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same branch / PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend — lint + test on a Python × OS matrix
  # ---------------------------------------------------------------------------
  test:
    name: lint + test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies (ffmpeg)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Sync dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Ruff (lint)
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Pytest with coverage
        run: |
          uv run --python ${{ matrix.python-version }} \
            pytest --cov=veauto --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Frontend — Svelte build (catches broken imports / TS errors)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: build web frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: web/frontend
        run: npm ci --no-audit --no-fund

      - name: Build Svelte bundle
        working-directory: web/frontend
        run: npm run build

      - name: Verify dist/ was produced
        working-directory: web/frontend
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "dist/ contents:"
          ls -la dist/
          ls -la dist/assets/

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/frontend/dist/
          retention-days: 7
